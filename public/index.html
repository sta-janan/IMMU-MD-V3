<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMMU MD V3 — Pair</title>
<style>
  :root { --bg:#0b0f14; --card:#121821; --accent:#25d366; --text:#e6edf3; --muted:#8b98a5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    background: var(--card); border-radius: 16px; padding: 32px 28px; max-width: 380px; width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,.4); text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  input {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a3441;
    background: #0e1420; color: var(--text); font-size: 16px; margin-bottom: 14px;
  }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--accent);
    color: #05220f; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .code-box {
    margin-top: 22px; padding: 20px; border-radius: 12px; background: #0e1420;
    border: 1px dashed var(--accent); display: none;
  }
  .code { font-size: 28px; letter-spacing: 4px; font-weight: 800; color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .msg { margin-top: 14px; font-size: 13px; color: #ff6b6b; display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>IMMU MD V3</h1>
    <p class="sub">Enter your WhatsApp number (with country code) to link this bot.</p>
    <input id="number" type="tel" placeholder="e.g. 923001234567" />
    <button id="submit">Get Pairing Code</button>
    <div class="msg" id="error"></div>
    <div class="code-box" id="codeBox">
      <div class="code" id="code">— — — —</div>
      <div class="hint">Open WhatsApp → Linked Devices → Link with phone number, then enter this code.</div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('submit');
    const input = document.getElementById('number');
    const errorBox = document.getElementById('error');
    const codeBox = document.getElementById('codeBox');
    const codeEl = document.getElementById('code');

    btn.addEventListener('click', async () => {
      const number = input.value.replace(/[^0-9]/g, '');
      errorBox.style.display = 'none';
      codeBox.style.display = 'none';

      if (number.length < 8) {
        errorBox.textContent = 'Enter a valid number with country code.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Generating code...';

      try {
        const res = await fetch(`/api/pair?number=${number}`);
        const data = await res.json();
        if (data.status === 'already_connected') {
          errorBox.textContent = 'This number is already connected.';
          errorBox.style.display = 'block';
        } else if (data.code) {
          codeEl.textContent = data.code;
          codeBox.style.display = 'block';
        } else {
          errorBox.textContent = data.error || 'Failed to generate code.';
          errorBox.style.display = 'block';
        }
      } catch (e) {
        errorBox.textContent = 'Network error, try again.';
        errorBox.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Get Pairing Code';
    });
  </script>
</body>
</html>
